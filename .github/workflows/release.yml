name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csax
          POSTGRES_PASSWORD: csax_test
          POSTGRES_DB: csax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v -o csax .

      - name: Vet
        run: go vet ./...

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations and exercise real commands — the release gate
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgres://csax:csax_test@localhost:5432/csax_test?sslmode=disable
          JWT_SECRET=ci-test-secret-not-for-prod
          MIGRATIONS_DIR=./migrations
          EOF
          ./csax migrate up
          ./csax users create ci-test@example.com "Pass@2026"
          ./csax users list
          ./csax stats
          ./csax health

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
