name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csax
          POSTGRES_PASSWORD: csax_test
          POSTGRES_DB: csax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout csax
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v -o csax .

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations via csax itself
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgres://csax:csax_test@localhost:5432/csax_test?sslmode=disable
          JWT_SECRET=ci-test-secret-not-for-prod
          MIGRATIONS_DIR=./migrations
          EOF
          ./csax migrate up
          ./csax migrate status

      - name: Exercise real database-touching commands
        run: |
          ./csax users create ci-test@example.com "Pass@2026"
          ./csax users get ci-test@example.com
          ./csax users list
          ./csax stats
          ./csax health